# Railway config — repo root level
# Used by: application, queue, scheduler services
# Root directory for these services must be set to "" (repo root)
# so that the Dockerfile can COPY from ./api/ and ./Caddyfile correctly.
#
# The start command and Docker target are overridden per-service via Railway dashboard.

[build]
builder = "dockerfile"
dockerfilePath = "docker/Dockerfile"

[deploy]
# Default target = application (overridden per service via Railway API/dashboard)
startCommand = "php artisan octane:frankenphp --max-requests=1000 --port=8000 --host=0.0.0.0"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5
