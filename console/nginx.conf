server {
    listen       ${PORT};
    server_name  localhost;

    # Dynamic DNS resolution for upstream
    resolver 8.8.8.8 1.1.1.1 valid=30s ipv6=off;

    location / {
        root   /usr/share/nginx/html;
        try_files $uri $uri/ /index.html =404;
    }

    location = /fleetbase.config.json {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
        add_header Access-Control-Allow-Origin "*";
    }

    # Proxy API and internal endpoints to backend application service
    location /int/ {
        proxy_pass https://application-production-919c.up.railway.app/int/;
        proxy_ssl_server_name on;
        proxy_set_header Host application-production-919c.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass https://application-production-919c.up.railway.app/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host application-production-919c.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}


