server {
    listen       ${PORT};
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        try_files $uri $uri/ /index.html =404;
    }

    # Serve runtime config with no cache
    # This tells the Ember app where the API lives
    location = /fleetbase.config.json {
        root /usr/share/nginx/html;
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
        try_files /fleetbase.config.json @config_fallback;
    }

    location @config_fallback {
        default_type application/json;
        # Hardcode our Railway API URL so the Ember app connects to the right backend
        return 200 '{"API_HOST":"https://application-production-919c.up.railway.app","SOCKETCLUSTER_HOST":"application-production-919c.up.railway.app","SOCKETCLUSTER_PORT":443,"SOCKETCLUSTER_SECURE":true}';
    }
}
