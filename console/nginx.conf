server {
    listen       ${PORT};
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        try_files $uri $uri/ /index.html =404;
    }

    # Always return the correct API URL — bypass the static fleetbase.config.json
    # that ships with the console package (it hardcodes localhost:8000).
    location = /fleetbase.config.json {
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
        add_header Access-Control-Allow-Origin "*";
        return 200 '{"API_HOST":"https://application-production-919c.up.railway.app","SOCKETCLUSTER_HOST":"application-production-919c.up.railway.app","SOCKETCLUSTER_PORT":443,"SOCKETCLUSTER_SECURE":true}';
    }
}
