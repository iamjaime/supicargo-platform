[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Serves the Laravel API
startCommand = "bash start.sh"
healthcheckPath = "/api/v1/health-check"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5

# Runs database migrations before the API comes up (first deploy only)
# After DB is initialized, you can comment this line out to save boot time
preDeployCommand = "php artisan key:generate --force && php artisan migrate --force && php artisan db:seed --force"

[build.buildArgs]
# Set to 'production' so composer installs without dev dependencies
COMPOSER_ENV = "production"
